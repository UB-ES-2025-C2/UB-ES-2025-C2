name: Build & Push Frontend & Backend to Docker Hub for Preproduction

on:
  push:
    branches:
      - staging

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract branch name
        id: extract_branch
        run: echo "branch=${GITHUB_REF##*/}" >> $GITHUB_OUTPUT

      # ---------- FRONTEND ----------
      - name: Build and push FRONTEND image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./frontend
          file: ./frontend/Dockerfile
          build-args: |
            APP=frontend
            PORT=80
            UID=988
            VITE_API_URL=${{ secrets.STAGING_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ub-es-2025-c2-fe-preprod:${{ steps.extract_branch.outputs.branch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ub-es-2025-c2-fe-preprod:latest

      # ---------- BACKEND ----------
      - name: Build and push BACKEND image
        uses: docker/build-push-action@v6
        with:
          push: true
          context: ./backend
          file: ./backend/Dockerfile
          build-args: |
            APP=backend
            PORT=80
            UID=988
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ub-es-2025-c2-be-preprod:${{ steps.extract_branch.outputs.branch }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ub-es-2025-c2-be-preprod:latest
