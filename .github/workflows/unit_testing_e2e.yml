name: E2e unit tests

on:
  push:
    branches: [ "staging", "prod" ]
  pull_request:
    branches: [ "staging", "prod" ]
  workflow_dispatch:

jobs:
  test_e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      # Install uv
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      # Add uv to PATH
      - name: Add uv to PATH
        run: echo "${HOME}/.cargo/bin" >> $GITHUB_PATH

      # Install dependencies using uv
      - name: Install dependencies with uv
        working-directory: backend
        run: uv sync --frozen

      # ---------- Run end-to-end tests ----------
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright system deps and browsers
        working-directory: frontend
        run: |
          # Install OS-level dependencies (Ubuntu) — optional but useful
          npx playwright install-deps || true
          # Install browser binaries required by Playwright
          npx playwright install --with-deps

      - name: Prepare and start Django dev server for E2E
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: music_space.settings
          SECRET_KEY: "dummy-key-for-ci-only"
        run: |
          # Apply migrations so server is ready for tests
          uv run python manage.py migrate --noinput
          # Start the Django server in background
          uv run python manage.py runserver 0.0.0.0:8000 &
          # Wait for server to accept connections (max ~30s)
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "Server is up"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: frontend
        env:
          BASE_URL: http://127.0.0.1:8000
        run: npm run test:e2e
