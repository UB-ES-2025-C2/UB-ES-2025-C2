name: E2E tests

on:
  push:
    branches: [ "staging", "prod" ]
  pull_request:
    branches: [ "staging", "prod" ]
  workflow_dispatch:

jobs:
  test_e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v4
        with:
          python-version: '3.14'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Add uv to PATH
        run: echo "${HOME}/.cargo/bin" >> $GITHUB_PATH

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright and system deps
        working-directory: frontend
        run: |
          npx playwright install-deps || true
          npx playwright install --with-deps

      # Start backend
      - name: Start Django backend
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: music_space.settings
          SECRET_KEY: "dummy-key-for-ci-only"
          DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
        run: |
          uv run python manage.py migrate --noinput

          # ensure an admin exists so fixtures that use ADMIN_USER/ADMIN_PASS can work
          nohup uv run python manage.py runserver 0.0.0.0:8000 > django.log 2>&1 &
          # wait for backend
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:8000/ > /dev/null 2>&1; then
              echo "Backend is up"
              break
            fi
            sleep 1
          done

      # Start frontend (Vite)
      - name: Start Vite frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host --port 5173 > vite.log 2>&1 &
          for i in {1..30}; do
            if curl -sSf http://127.0.0.1:5173/ > /dev/null 2>&1; then
              echo "Frontend is up"
              break
            fi
            sleep 1
          done

      - name: Run E2E tests
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
          FRONTEND_URL: http://127.0.0.1:5173
          ADMIN_USER: admin
          ADMIN_PASS: admin123
        run: |
          set -o pipefail
          npm run test:e2e || (echo "=== django.log ===" && tail -n +1 ../backend/django.log || true; echo "=== vite.log ===" && tail -n +1 vite.log || true; exit 1)
